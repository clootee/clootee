name: Public source check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/release/public-snapshot.test.mjs
      - run: node scripts/release/public-snapshot.mjs check
