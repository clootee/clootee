# clootee.xfeixie.com --- Clootee 应用本体（纯静态，无口令）
# 服务器 personal1 106.13.193.3，root 直指 git 检出目录，更新只要 git pull
server {
    listen 80;
    server_name clootee.xfeixie.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/clootee.xfeixie.com_acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    include /www/server/nginx/conf/geoblock/guard.conf;
    server_name clootee.xfeixie.com;

    ssl_certificate     /www/server/panel/vhost/cert/clootee.xfeixie.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/clootee.xfeixie.com/privkey.pem;

    root  /www/wwwroot/clootee/projects/claude_hub/frontend;
    index index.html;

    location ^~ /api/ {
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8970/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /ws {
        proxy_pass http://127.0.0.1:8970/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /www/wwwlogs/clootee.xfeixie.com.log;
    error_log  /www/wwwlogs/clootee.xfeixie.com.error.log;
}
