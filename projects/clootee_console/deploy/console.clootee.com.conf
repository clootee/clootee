# console.clootee.com —— Clootee 默认服务商网关（device key / 用量 / Anthropic+OpenAI 兼容）
# 80：只放行 ACME 校验 + 301；443：全部反代 127.0.0.1:8980
# 证书：acme.sh（webroot /www/wwwroot/console.clootee.com_acme），装到 /www/wwwroot/console.clootee.com_cert

server {
    listen 80;
    server_name console.clootee.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/console.clootee.com_acme;
        default_type "text/plain";
    }

    location / { return 301 https://console.clootee.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name console.clootee.com;

    ssl_certificate     /www/wwwroot/console.clootee.com_cert/fullchain.pem;
    ssl_certificate_key /www/wwwroot/console.clootee.com_cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL_CLOOTEECONSOLE:10m;
    ssl_session_timeout 1d;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/console.clootee.com_acme;
        default_type "text/plain";
    }

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8980;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # SSE 必须关缓冲，否则客户端一直等不到增量
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
